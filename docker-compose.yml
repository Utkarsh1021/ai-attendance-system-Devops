services:

  # =========================
  # SPRING BOOT BACKEND
  # =========================

  backend:

    build:

      context: .

    container_name: attendance-backend

    restart: unless-stopped

    ports:

      - "8082:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://persistent_db:3306/userdb

      SPRING_DATASOURCE_USERNAME: appuser

      SPRING_DATASOURCE_PASSWORD: apppass

    networks:

      - attendance-network

      - persistent-demo_default

  # =========================
  # REACT FRONTEND
  # =========================

  frontend:

    build:

      context: ./attendance-frontend

    container_name: attendance-frontend

    restart: unless-stopped

    depends_on:

      - backend

    ports:

      - "3001:3000"

    networks:

      - attendance-network

  # =========================
  # NGINX REVERSE PROXY
  # =========================

  nginx:

    image: nginx:latest

    container_name: attendance-nginx

    restart: unless-stopped

    depends_on:

      - frontend

      - backend

    ports:

      - "8085:80"

    volumes:

      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:

      - attendance-network

# =========================
# NETWORKS
# =========================

networks:

  attendance-network:

  persistent-demo_default:

    external: true