name: CI/CD Pipeline

on:

  push:

    branches:

      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT CODE
      # =========================

      - name: Checkout Code

        uses: actions/checkout@v4

      # =========================
      # SETUP JAVA
      # =========================

      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          java-version: '17'

          distribution: 'temurin'

      # =========================
      # BUILD SPRING BOOT
      # =========================

      - name: Build Spring Boot App

        run: |

          mvn clean install -DskipTests

      # =========================
      # LOGIN TO DOCKERHUB
      # =========================

      - name: Login to DockerHub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKER_USERNAME }}

          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # BUILD DOCKER IMAGE
      # =========================

      - name: Build Docker Image

        run: |

          docker build -t ${{ secrets.DOCKER_USERNAME }}/attendance-system .

      # =========================
      # PUSH DOCKER IMAGE
      # =========================

      - name: Push Docker Image

        run: |

          docker push ${{ secrets.DOCKER_USERNAME }}/attendance-system