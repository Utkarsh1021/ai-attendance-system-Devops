apiVersion: apps/v1

kind: Deployment

metadata:

  name: attendance-frontend

spec:

  replicas: 1

  selector:

    matchLabels:

      app: attendance-frontend

  template:

    metadata:

      labels:

        app: attendance-frontend

    spec:

      containers:

        - name: frontend

          image: nginx:latest

          ports:

            - containerPort: 80

---

apiVersion: v1

kind: Service

metadata:

  name: attendance-frontend-service

spec:

  selector:

    app: attendance-frontend

  ports:

    - protocol: TCP

      port: 80

      targetPort: 80

  type: LoadBalancer