apiVersion: v1

kind: ConfigMap

metadata:

  name: prometheus-config

data:

  prometheus.yml: |

    global:

      scrape_interval: 15s

    scrape_configs:

      - job_name: 'prometheus'

        static_configs:

          - targets: ['localhost:9090']

      - job_name: 'kube-state-metrics'

        static_configs:

          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

---

apiVersion: apps/v1

kind: Deployment

metadata:

  name: prometheus

spec:

  replicas: 1

  selector:

    matchLabels:

      app: prometheus

  template:

    metadata:

      labels:

        app: prometheus

    spec:

      containers:

        - name: prometheus

          image: quay.io/prometheus/prometheus:v2.53.1

          ports:

            - containerPort: 9090

          volumeMounts:

            - name: prometheus-config-volume

              mountPath: /etc/prometheus/

      volumes:

        - name: prometheus-config-volume

          configMap:

            name: prometheus-config

---

apiVersion: v1

kind: Service

metadata:

  name: prometheus-service

spec:

  selector:

    app: prometheus

  ports:

    - protocol: TCP

      port: 9090

      targetPort: 9090

  type: LoadBalancer